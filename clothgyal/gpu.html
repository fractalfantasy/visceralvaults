<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClothGyal GPU</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #hud { position: fixed; left: 12px; bottom: 10px; color: #7fb; font-size: 12px; opacity: .85; }
  #hud a, #switch a { color: #7fb; }
  #switch { position: fixed; left: 12px; top: 10px; color: #7fb; font-size: 12px; opacity: .85; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #9cc; font-size: 14px; text-align: center; }
  /* dat.gui only measures its height once; let the panel scroll within the window whatever is open */
  .dg.ac { max-height: 100vh; }
  .dg.main { max-height: 100vh; overflow-y: auto !important; overflow-x: hidden; }
  .dg.main > ul { height: auto !important; max-height: none !important; overflow: visible !important; }
  /* dat.gui makes the button position:absolute when tall (it ends up above the screen): pin it to the panel bottom */
  .dg.main .close-button, .dg.main.taller-than-window .close-button { position: sticky !important; bottom: 0 !important; top: auto !important; margin-top: 0 !important; z-index: 2; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "dat.gui": "https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.module.js"
} }
</script>
</head>
<body>
<div id="loading">loading clothgyal.glb…</div>
<div id="switch">WebGPU solver · <a href="./index.html?cpu">switch to CPU version</a></div>
<div id="hud"></div>
<script type="module" src="./main_gpu.js"></script>
</body>
</html>
