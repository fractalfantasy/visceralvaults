<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>JASHIM — Listening room</title>
<!-- Format 2, the listening room: black, the music first. The cover over its own blur, one big play
     button, the tracklist with a progress line under each song; the press release folded away below. -->
<style>
  :root { --grey: #d4d4d4; --dim: #8c8c8c; --line: #262626; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font: 15px/1.6 Helvetica, Arial, sans-serif; }
  a { color: inherit; }
  .bg { position: fixed; inset: -40px; background: url(../../img/jashim-cover.jpg?v=3) center / cover; filter: blur(60px) brightness(.16) saturate(1.2); z-index: -1; transform: scale(1.1); }
  .hero { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 48px 16px; }
  .hero .cover { width: min(340px, 72vw); display: block; margin: 0 auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
  .hero .title { width: min(300px, 64vw); display: block; margin: 30px auto 10px; }
  .kicker { font-size: 11px; letter-spacing: .35em; text-transform: uppercase; color: var(--grey); }
  .big { width: 76px; height: 76px; border-radius: 50%; border: 1px solid #fff; background: none; color: #fff; cursor: pointer; margin: 30px auto 0; display: grid; place-items: center; transition: background .2s, color .2s; }
  .big:hover { background: #fff; color: #000; }
  .big svg { width: 26px; height: 26px; fill: currentColor; }
  .big .pause { display: none; } body.is-playing .big .pause { display: block; } body.is-playing .big .play { display: none; }
  .now { margin: 18px 0 2px; font-size: 13px; color: var(--grey); min-height: 1.6em; }
  .time { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; min-height: 1.6em; }
  .scroll { margin: 34px 0 0; font-size: 10px; letter-spacing: .3em; color: var(--dim); }
  .list { max-width: 760px; margin: 0 auto; padding: 0 16px 60px; }
  .track { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 16px 0 0; cursor: pointer; }
  .track .n { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .track .t { font-size: 22px; letter-spacing: -.01em; }
  .track .f { font-size: 13px; color: var(--dim); margin-left: 8px; }
  .track .len { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .track:hover .t { color: var(--grey); }
  .track.is-current .n { color: #fff; }
  .line { grid-column: 1 / -1; height: 1px; background: var(--line); margin-top: 14px; position: relative; }
  .line i { position: absolute; inset: 0 auto 0 0; width: 0; background: #fff; height: 1px; }
  .track.is-current .line { height: 2px; } .track.is-current .line i { height: 2px; }
  details { max-width: 760px; margin: 0 auto; padding: 0 16px; border-top: 1px solid var(--line); }
  summary { cursor: pointer; list-style: none; padding: 20px 0; font-size: 11px; letter-spacing: .35em; text-transform: uppercase; color: var(--grey); }
  summary::after { content: ' +'; } details[open] summary::after { content: ' −'; }
  details p { color: #ddd; margin: 0 0 16px; }
  .singles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 0 0 24px; }
  .singles img { width: 100%; display: block; }
  .singles b { display: block; margin: 10px 0 2px; }
  .singles span { font-size: 12px; color: var(--dim); }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 40px 16px; scroll-snap-type: x mandatory; }
  .strip img { height: min(60vh, 520px); scroll-snap-align: center; flex: none; }
  .foot { text-align: center; padding: 20px 16px 60px; font-size: 11px; color: var(--dim); letter-spacing: .1em; }
  .foot a.pre { display: inline-block; margin: 0 0 20px; border: 1px solid #fff; padding: 12px 24px; letter-spacing: .3em; font-size: 11px; text-decoration: none; color: #fff; }
  .foot a.pre:hover { background: #fff; color: #000; }
</style>
</head>
<body>
<div class="bg"></div>
<section class="hero">
  <div>
    <img class="cover" src="../../img/jashim-cover.jpg?v=3" alt="JASHIM, the album cover">
    <img class="title" src="../../img/jashim-impact-white.png" alt="JASHIM">
    <div class="kicker">The debut album · <span id="release"></span></div>
    <button class="big" data-toggle aria-label="Play">
      <svg class="play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
      <svg class="pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <div class="now" data-now></div>
    <div class="time" data-time></div>
    <div class="scroll">↓ THE ALBUM</div>
  </div>
</section>
<section class="list" id="list"></section>
<details>
  <summary>About the record</summary>
  <div id="bio"></div>
  <div class="singles" id="singles"></div>
</details>
<div class="strip" id="strip"></div>
<div class="foot">
  <a class="pre" id="presave" target="_blank">PRE-SAVE THE ALBUM</a><br>
  Executive producer: Sinjin Hawke · © Visceral Vaults 2026 · VV007<br>
  Interviews, premieres and reviews: <a id="contact"></a>
</div>
<script src="../player.js"></script>
<script>
  var A = JASHIM.ALBUM, S = JASHIM.SONGS, $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var up = function (p) { return '../' + p; };
  $('release').textContent = A.releaseShort;
  $('presave').href = A.presave;
  $('contact').href = 'mailto:' + A.contact; $('contact').textContent = A.contact;
  $('list').innerHTML = S.map(function (s, i) {
    return '<div class="track" data-play="' + i + '"><span class="n">' + String(s.n).padStart(2, '0') + '</span><span><span class="t">' + esc(s.title) + '</span>' +
      (s.feat ? '<span class="f">feat. ' + esc(s.feat) + '</span>' : '') + '</span><span class="len">' + s.length + '</span>' +
      '<div class="line" data-seek="' + i + '"><i data-progress></i></div></div>';
  }).join('');
  $('bio').innerHTML = A.bio.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '<p><i>' + esc(A.out) + '</i></p>';
  $('singles').innerHTML = A.singles.map(function (s) {
    return '<div><img src="' + up(s.art) + '" alt="' + esc(s.title) + '"><b>' + esc(s.title) + '</b><span>Out ' + esc(s.out) + ' · <a href="' + s.link + '" target="_blank">Listen</a></span></div>';
  }).join('');
  $('strip').innerHTML = A.photos.map(function (p, i) { return '<img src="' + up(p) + '" alt="JASHIM, press photo ' + (i + 1) + '" loading="lazy">'; }).join('');
  // a song's line is its own seek bar; clicking the row elsewhere plays or pauses it
  document.querySelectorAll('.line').forEach(function (l) { l.addEventListener('click', function (e) { e.stopPropagation(); }); });
  JASHIM.draw();
</script>
</body>
</html>
