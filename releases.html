<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Releases — Visceral Vaults</title>
<meta name="description" content="Full discography of Visceral Vaults, an independent record label based in Montreal, Québec.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">VISCERAL <span>VAULTS</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="releases.html" aria-current="page">Releases</a>
      <a href="about.html">About</a>
      <a href="https://visceralvaults.bandcamp.com/contact?b=2374827712&n=Visceral%20Vaults" target="_blank" rel="noopener">Contact</a>
      <a href="https://visceralvaults.bandcamp.com/" target="_blank" rel="noopener">Bandcamp ↗</a>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<section class="page-head">
  <div class="wrap">
    <h1>Releases</h1>
    <p>The full Visceral Vaults discography. Click a release for tracklist and details.</p>
  </div>
</section>

<main class="wrap">
  <section class="section">
    <div class="release-grid" id="all-release-grid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="copyright">© <span id="year"></span> Visceral Vaults</p>
    <div class="footer-links">
      <a href="https://visceralvaults.bandcamp.com/" target="_blank" rel="noopener">Bandcamp</a>
      <a href="https://visceralvaults.bandcamp.com/contact?b=2374827712&n=Visceral%20Vaults" target="_blank" rel="noopener">Contact</a>
    </div>
  </div>
</footer>

<div class="modal-overlay">
  <div class="modal">
    <img class="modal-cover" src="" alt="">
    <div class="modal-body">
      <button class="modal-close" aria-label="Close">&times;</button>
      <h3 class="modal-title"></h3>
      <p class="modal-artist artist"></p>
      <p class="modal-credit credit"></p>
      <p class="modal-date date"></p>
      <ul class="tracklist"></ul>
      <a class="btn btn-solid modal-link" href="#" target="_blank" rel="noopener">Listen / Buy on Bandcamp</a>
    </div>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  loadReleases().then((releases) => initReleaseGrid(releases, "#all-release-grid"));
</script>

</body>
</html>
