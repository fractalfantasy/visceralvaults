<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CD · Visceral Vaults</title>
<meta name="description" content="Every Visceral Vaults release, in a jewel case you can open, turn and spin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<!-- The Visceral Vaults catalogue as CDs: a clear jewel case (lit by a studio, refracting what's behind it), the
     release's cover printed on a disc whose tracks split the lamps into rainbows. Tap the case to open it, drag
     to turn it; Spin, Play (the release's music) and the covers along the bottom. cd.js does it all (three.js). -->
<style>
  :root { --ink: #111; --dim: #8a8a8a; --line: #e4e4e2; --page: #f6f6f4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--page); color: var(--ink);
    font: 13px/1.4 Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  canvas.over { cursor: pointer; }

  .corner { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 20px; z-index: 2; }
  .corner a { display: block; }
  .corner img { width: 132px; display: block; }
  .release { position: fixed; top: max(18px, env(safe-area-inset-top)); right: 20px; z-index: 2; text-align: right; }
  .release b { display: block; font-weight: 700; font-size: 14px; letter-spacing: .02em; }
  .release span { color: var(--dim); }
  .release .playing { display: block; margin-top: 4px; color: var(--ink); font-size: 12px; min-height: 1.4em; }

  .hint { position: fixed; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom)); text-align: center;
    color: var(--dim); font-size: 12px; letter-spacing: .02em; pointer-events: none; transition: opacity .6s; z-index: 2; }
  .hint.gone { opacity: 0; }

  .dock { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 2;
    display: flex; align-items: center; gap: 6px; padding: 7px; border-radius: 16px; background: rgba(255, 255, 255, .82);
    border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0, 0, 0, .07); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    max-width: calc(100vw - 20px); }
  .covers { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .covers::-webkit-scrollbar { display: none; }
  .thumb { flex: none; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; position: relative;
    background: #ddd center / cover; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); transition: transform .2s; }
  .thumb::after { content: ''; position: absolute; inset: 15px; border-radius: 50%; background: var(--page); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
  .thumb:hover { transform: scale(1.06); }
  .thumb[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
  .divider { width: 1px; height: 26px; background: var(--line); margin: 0 4px; flex: none; }
  .tool { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    background: var(--ink); color: #fff; }
  .tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tool .on { display: none; }
  .tool[aria-pressed="true"] .on { display: block; }
  .tool[aria-pressed="true"] .off { display: none; }
  .tool:focus-visible, .thumb:focus-visible { outline: 2px solid #4a7dff; outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .fail { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--dim); }
  @media (max-width: 560px) {
    .corner img { width: 108px; }
    .release { top: auto; bottom: calc(150px + env(safe-area-inset-bottom)); left: 20px; right: 20px; text-align: center; }
    .hint { bottom: calc(84px + env(safe-area-inset-bottom)); }
    .thumb, .tool { width: 36px; height: 36px; }
    .thumb::after { inset: 13px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="corner"><a href="/" aria-label="Visceral Vaults home"><img src="../assets/img/site/visceral-vaults-wordmark.png" alt="VISCERAL VAULTS"></a></div>
<div class="release" aria-live="polite"><b id="title"></b><span id="artist"></span><span class="playing" id="playing"></span></div>
<div class="hint" id="hint">Tap the case to open it · drag to turn it</div>
<div class="dock" role="toolbar" aria-label="CD">
  <div class="covers" id="covers"></div>
  <div class="divider"></div>
  <button class="tool" id="open" aria-pressed="false" title="Open (O)"><span class="sr">Open the case</span>
    <svg viewBox="0 0 24 24"><path class="off" d="M5 19V5h9l5 5v9z"/><path class="on" d="M5 19V5h14v14z M5 5l7 7"/></svg></button>
  <button class="tool" id="spin" aria-pressed="false" title="Spin (S)"><span class="sr">Spin the disc</span>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 4a8 8 0 0 1 8 8"/></svg></button>
  <button class="tool" id="play" aria-pressed="false" title="Play (P)"><span class="sr">Play the release</span>
    <svg viewBox="0 0 24 24"><path class="off" d="M8 5v14l11-7z"/><path class="on" d="M8 5v14M16 5v14"/></svg></button>
</div>
<div class="fail" id="fail">This page needs WebGL, and the browser couldn't start it.</div>
<script type="module" src="cd.js"></script>
</body>
</html>
