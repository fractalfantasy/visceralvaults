<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visceral Vaults — Releases</title>
<meta name="description" content="Visceral Vaults is an independent record label based in Montreal, Québec. Browse the full discography.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <span class="brand">VISCERAL <span>VAULTS</span></span>
  </div>
</header>

<section class="hero">
  <img class="hero-logo" src="assets/img/site/banner-wordmark.png" alt="Visceral Vaults">
  <p class="hero-tagline">Independent record label — Montreal, Québec</p>
</section>

<main class="wrap">
  <section class="section">
    <h1 class="section-title">Releases</h1>
    <div class="release-grid" id="release-grid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="copyright">© <span id="year"></span> Visceral Vaults</p>
  </div>
</footer>

<div class="modal-overlay">
  <div class="modal">
    <img class="modal-cover" src="" alt="">
    <div class="modal-body">
      <button class="modal-close" aria-label="Close">&times;</button>
      <h3 class="modal-title"></h3>
      <p class="modal-artist artist"></p>
      <p class="modal-credit credit"></p>
      <p class="modal-date date"></p>
      <ul class="tracklist"></ul>
      <a class="btn btn-solid modal-link" href="#" target="_blank" rel="noopener">Listen / Buy on Bandcamp</a>
    </div>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  loadReleases().then((releases) => initReleaseGrid(releases, "#release-grid"));
</script>

</body>
</html>
